        function initializeFilters() {
            const filtersContent = document.getElementById('filtersContent');
            if (filtersContent) {
                filtersContent.style.maxHeight = filtersContent.scrollHeight + 'px';
            }
        }

        function toggleFilters() {
            filtersExpanded = !filtersExpanded;
            const filtersContent = document.getElementById('filtersContent');
            const toggleBtn = document.querySelector('.toggle-filters');

            if (filtersExpanded) {
                filtersContent.style.maxHeight = filtersContent.scrollHeight + 'px';
                filtersContent.classList.remove('collapsed');
                toggleBtn.classList.remove('collapsed');
            } else {
                filtersContent.style.maxHeight = '0';
                filtersContent.classList.add('collapsed');
                toggleBtn.classList.add('collapsed');
            }
        }

            currentFilter = filter;
            updateFilterButtons();

            displayDashboard(feedbackData);

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');

            const activeFilterBtn = document.querySelector(`[data-filter="${currentFilter}"]`);
            const activeSortBtn = document.querySelector(`[data-sort="${currentSort}"]`);

            if (activeFilterBtn) activeFilterBtn.classList.add('active');
            if (activeSortBtn) activeSortBtn.classList.add('active');
        }

            } else if (currentFilter === 'neutral') {
                filtered = filtered.filter(item => item.mood === 3);

            } else if (currentFilter === 'detractors') {
                filtered = filtered.filter(item => item.recommendationLikelihood <= 6);

                                    <div class="stat-label">Avg Mood</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value">${avgNPS}/10</div>
                                    <div class="stat-label">Avg NPS</div>
                                </div>
                            </div>
                        </div>

                        <div class="section">
                            <h2 class="section-title">🎯 Theme Analysis</h2>
                            <div class="themes-container">
                                ${themes.map(theme => createThemeCard(theme)).join('')}
                            </div>
                        </div>
                    </div>
                </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        function createFeedbackCard(item, index) {
            const sentiment = getSentiment(item.mood);
            const sentimentClass = sentiment.toLowerCase();

            return `
                <div class="feedback-card">
                    <div class="feedback-header">
                        <div style="flex: 1;">
                            <div class="feedback-comment">"${item.comment}"</div>
                            <span class="sentiment-badge sentiment-${sentimentClass}">${sentiment}</span>
                        </div>
                        <div class="feedback-metrics">
                            <div class="metric">
                                <div class="metric-label">Mood</div>
                                <div class="metric-value">${item.mood}/5</div>
                                <div class="mood-indicator">
                                    ${generateStars(item.mood)}
                                </div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">NPS</div>
                                <div class="metric-value">${item.recommendationLikelihood}</div>
                                <div class="nps-bar">
                                    <div class="nps-fill" style="width: ${item.recommendationLikelihood * 10}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${item.url || item.platform ? `
                        <div class="feedback-meta">
                            ${item.platform ? `<div class="meta-item">💻 ${item.platform}</div>` : ''}
                            ${item.browser ? `<div class="meta-item">🌐 ${item.browser.split(' ')[0]}</div>` : ''}
                            ${item.url ? `<div class="meta-item">🔗 <a href="${item.url}" target="_blank" style="color: #0051C1;">View Page</a></div>` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function generateStars(mood) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<span class="mood-star ${i <= mood ? 'filled' : 'empty'}">★</span>`;
            }
            return stars;
        }

        function getSentiment(mood) {
            if (mood >= 4) return 'Positive';
            if (mood >= 3) return 'Neutral';
            return 'Negative';
        }

        function analyzeThemes(feedbackData) {
            const themes = [];

            const mobileIssues = feedbackData.filter(item =>
                (item.comment.toLowerCase().includes('mobile') ||
                item.comment.toLowerCase().includes('popup') ||
                item.comment.toLowerCase().includes('keyboard') ||
                item.comment.toLowerCase().includes('feedback tab')) &&
                item.mood <= 3
            );
            if (mobileIssues.length > 0) {
                themes.push({
                    title: 'Mobile UX Issues',
                    count: mobileIssues.length,
                    description: 'Users experiencing problems with mobile interface, including popup overlays, keyboard covering content, and feedback tab placement.',
                    recommendation: 'Redesign mobile UI to prevent overlays from blocking content. Implement smart keyboard handling that adjusts viewport. Move feedback tab to non-intrusive location.',
                    icon: '📱'
                });
            }

            const languageIssues = feedbackData.filter(item =>
                item.comment.toLowerCase().includes('language') ||
                item.comment.toLowerCase().includes('asian') ||
                item.comment.toLowerCase().includes('can\'t read')
            );
            if (languageIssues.length > 0) {
                themes.push({
                    title: 'Language & Localization',
                    count: languageIssues.length,
                    description: 'Users encountering unexpected language changes or inability to switch languages.',
                    recommendation: 'Add prominent language selector. Respect browser locale settings. Ensure consistent language experience across all pages.',
                    icon: '🌐'
                });
            }

            const positiveDiscovery = feedbackData.filter(item =>
                (item.comment.toLowerCase().includes('love') ||
                 item.comment.toLowerCase().includes('found') ||
                 item.comment.toLowerCase().includes('great')) &&
                item.mood >= 4
            );
            if (positiveDiscovery.length > 0) {
                themes.push({
                    title: 'Memory Discovery Success',
                    count: positiveDiscovery.length,
                    description: 'Users successfully discovering and connecting with family memories and ancestors.',
                    recommendation: 'Amplify discovery features: implement "memories you might like" recommendations, notify users of newly added content from relatives, highlight successful connections.',
                    icon: '✨'
                });
            }

            const enthusiasticUsers = feedbackData.filter(item =>
                (item.comment.match(/[!?]{5,}/g) || item.comment.length > 500) &&
                item.mood >= 4
            );
            if (enthusiasticUsers.length > 0) {
                themes.push({
                    title: 'Highly Engaged Users',
                    count: enthusiasticUsers.length,
                    description: 'Users showing exceptional enthusiasm and engagement with the platform.',
                    recommendation: 'Create ambassador program for power users. Offer advanced features or early access to beta features. Encourage content contribution.',
                    icon: '⭐'
                });
            }

            return themes.sort((a, b) => b.count - a.count);
        }

        function createThemeCard(theme) {
            return `
                <div class="theme-card">
                    <div class="theme-title">
                        <span>${theme.icon}</span>
                        ${theme.title}
                        <span class="theme-count">${theme.count} mention${theme.count > 1 ? 's' : ''}</span>
                    </div>
                    <div class="theme-description">${theme.description}</div>
                    <div class="recommendation">
                        <div class="recommendation-title">
                            💡 Product Recommendation
                        </div>
                        <div class="recommendation-text">${theme.recommendation}</div>
                    </div>
                </div>
            `;
        }

        // Load feedback on page load
        loadFeedback();
    </script>
</body>
</html>
